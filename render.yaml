# Render Static Site — Blueprint example
# Or configure the same settings in the Dashboard.

services:
  - type: web
    runtime: static
    name: welcome-night
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Env (Dashboard → Environment):
    #   VITE_SUPABASE_URL
    #   VITE_SUPABASE_ANON_KEY
